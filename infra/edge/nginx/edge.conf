# CMP-10 local edge (AD-19): the Compose stand-in for the production ALB in ../terraform.
# Mount as /etc/nginx/conf.d/default.conf, with infra/edge/certs/local (npm run certs:local)
# at /etc/nginx/certs. Routing, TLS policy and re-encryption mirror the ALB listener;
# test/routing.test.ts proves both send every AD-19 request to the same place.

server_tokens off;

upstream api {
    server api:8443;
}

upstream keycloak {
    server keycloak:8443;
}

server {
    # 443 only: like the ALB there is no port 80 listener, not even a redirect.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    # The AES-GCM suites of ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Re-encrypt to both upstreams. Locally they present self-signed certificates.
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_server_name on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # Same as the ALB deny_traversal rule: no dot segments or encoded dots and slashes.
    if ($request_uri ~* "(\.\.|%2e|%2f)") {
        return 404;
    }

    # Keycloak admin console, admin REST API and master realm are never routed.
    location = /admin {
        return 404;
    }
    location ^~ /admin/ {
        return 404;
    }
    location = /realms/master {
        return 404;
    }
    location ^~ /realms/master/ {
        return 404;
    }

    location ^~ /realms/signin-reports/ {
        proxy_pass https://keycloak;
    }
    location ^~ /resources/ {
        proxy_pass https://keycloak;
    }

    # Any other realm is answered here rather than by the api.
    location = /realms {
        return 404;
    }
    location ^~ /realms/ {
        return 404;
    }

    location / {
        proxy_pass https://api;
    }
}
