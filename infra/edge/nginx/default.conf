# CMP-10 — the local edge (AD-19), mirroring the ALB in infra/edge/terraform. Compose mounts
# this file over /etc/nginx/conf.d/default.conf, so the image's stock port-80 server is gone,
# and mounts infra/edge/certs/local (npm run certs:local) at /etc/nginx/certs.

upstream api {
    server api:8443;
}

upstream keycloak {
    server keycloak:8443;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    # The ALB's ELBSecurityPolicy-TLS13-1-2-Res-FIPS-2023-04: TLS 1.3 and 1.2, forward-secret
    # AES-GCM suites, NIST curves only.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve prime256v1:secp384r1;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Re-encryption: the services serve HTTPS with the same local certificate.
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/cert.pem;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port 443;

    # The ALB's deny_encoded rule: traversal anywhere in the path, and any percent-encoding in
    # the Keycloak paths. Only the path is examined; OIDC query strings stay encoded.
    if ($request_uri ~* "^[^?]*(\.\.|%2e|%2f)|^/(realms/signin-reports|resources)/[^?]*%") {
        return 404;
    }

    # The ALB's deny_admin rule. Plain prefix locations below let these regexes win.
    location ~ ^/admin(/|$) {
        return 404;
    }

    location ~ ^/realms/master(/|$) {
        return 404;
    }

    location ~ ^/resources/[^/]+/admin/ {
        return 404;
    }

    location /realms/signin-reports/ {
        proxy_pass https://keycloak;
    }

    location /resources/ {
        proxy_pass https://keycloak;
    }

    location / {
        proxy_pass https://api;
    }
}
