# Build-time options (baked by kc.sh build in the Dockerfile)
features=fips
fips-mode=strict
db=postgres
health-enabled=true
metrics-enabled=true

# TLS only, re-encrypted from the ALB (AD-19). The BCFKS keystore and the RDS CA bundle are
# mounted by the task; the keystore password is KC_HTTPS_KEY_STORE_PASSWORD from Secrets Manager.
http-enabled=false
https-port=8443
https-protocols=TLSv1.3,TLSv1.2
https-key-store-type=bcfks
https-key-store-file=/opt/keycloak/conf/tls/server.bcfks
truststore-paths=/opt/keycloak/conf/tls/rds-ca.pem
proxy-headers=xforwarded
hostname-strict=true
http-management-port=9000

# ${vault.*} references in the realm export resolve from files ECS mounts from Secrets Manager.
vault=file
vault-dir=/opt/keycloak/vault

log=console
log-console-output=json
