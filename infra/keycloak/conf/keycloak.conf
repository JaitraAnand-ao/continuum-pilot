# Build-time options are fixed by `kc.sh build`; runtime values (hostname, database URL and
# login, keystore paths and their unlock values) arrive from the task environment as KC_* variables,
# the sensitive ones injected by the task definition from AWS by ARN.

# FIPS 140-3: BouncyCastle FIPS in approved-only mode, BCFKS keystores (AD-6).
features=fips
fips-mode=strict
https-key-store-type=bcfks
https-trust-store-type=bcfks

db=postgres
health-enabled=true
metrics-enabled=true

# The ALB re-encrypts to 8443; plain HTTP is never served.
http-enabled=false
https-port=8443
proxy-headers=xforwarded
hostname-strict=true

log-console-output=json
